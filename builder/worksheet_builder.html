<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기출 문항집 제작기</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#dfe3e8; --ink:#1b1f24; --dim:#6b7280;
    --accent:#2563eb; --accent-soft:#eff4ff; --warn:#b45309;
    --preview-w:640px;   /* 후보 목록의 문항 이미지 최대 가로폭 */
    --noticeH:26px; --attrH:20px;   /* 저작권 안내줄·출처 표기줄 높이(둘 다 인쇄에서는 숨김) */
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 "Malgun Gothic","맑은 고딕",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  button{font:inherit;cursor:pointer}

  /* ── 저작권 안내 / 출처 표기 ─────────────────
     둘 다 body 의 직속 자식이라 아래 @media print 의
     body>*{display:none!important} 규칙에 자동으로 걸려 인쇄에는 절대 안 남는다.
     (편집 화면에서만 보이면 되고, #print 안에 넣을 이유가 없어서 이렇게 뒀다) */
  #notice{height:var(--noticeH);line-height:var(--noticeH);padding:0 14px;font-size:11px;
          color:#92400e;background:#fffbeb;border-bottom:1px solid #fde68a;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #attribution{position:fixed;left:0;right:10px;bottom:0;height:var(--attrH);line-height:var(--attrH);
          font-size:10px;color:#9aa1ac;text-align:right;z-index:4;pointer-events:none}
  #attribution a{color:#9aa1ac;pointer-events:auto}

  /* ── 편집 화면 ───────────────────────────── */
  #app{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - var(--noticeH))}
  aside{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px}
  aside h1{font-size:15px;margin:0 0 12px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .sidebtn{display:flex;gap:6px;margin-bottom:10px}
  .sidebtn button{flex:1;padding:5px 8px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px}
  .sidebtn button:disabled{opacity:.45;cursor:default}
  .tabs button{flex:1 1 45%;min-width:0;padding:7px 6px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:13px}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .unit{margin:14px 0 6px;font-size:12px;color:var(--dim);font-weight:700}
  .std{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:7px;cursor:pointer;position:relative;user-select:none}
  .std:hover{background:var(--accent-soft)}
  .std.on{background:var(--accent-soft);outline:1px solid var(--accent)}
  .std input{margin-top:3px;pointer-events:none}
  .std .code{font-weight:700;font-size:12.5px}
  .std .txt{font-size:11.5px;color:var(--dim);display:block;margin-top:2px}
  .std .cnt{margin-left:auto;font-size:11px;background:#eef1f5;border-radius:10px;padding:1px 7px;color:var(--dim);white-space:nowrap}
  .std .cnt.zero{background:#fdecec;color:#b91c1c}
  .std .only{display:none;position:absolute;right:6px;top:6px;font-size:10.5px;padding:2px 7px;
             border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:11px}
  .std:hover .only{display:block}
  .std:hover .cnt{visibility:hidden}

  main{overflow:auto;padding:16px 20px 60px}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .bar .row+.row{margin-top:8px}
  .bar button{padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:7px;font-size:12.5px}
  .bar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .bar label{font-size:12.5px;display:inline-flex;gap:5px;align-items:center;color:#374151}
  .bar select,.bar input[type=text]{font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .count{font-size:12.5px;color:var(--dim);margin-left:auto}
  .filter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);
          border-radius:8px;padding:8px 11px;margin-top:8px}
  .filter .grp{display:flex;gap:6px;align-items:center}
  .filter .lb{font-size:11.5px;color:var(--dim);font-weight:700}
  .filter input[type=range]{width:132px;accent-color:var(--accent)}
  .filter .rng{font-size:12px;font-weight:700;min-width:96px;text-align:center;color:#1d4ed8}
  .chip{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--dim)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:#1d4ed8;font-weight:700}
  .filter .hit{margin-left:auto;font-size:11.5px;color:var(--dim)}
  .sep{width:1px;height:20px;background:var(--line)}

  .card{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden;scroll-margin-top:110px}
  .card.off{opacity:.45}
  .card.flash{animation:flash 1.4s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 3px #93c5fd}100%{box-shadow:0 0 0 0 rgba(147,197,253,0)}}
  .chead{display:flex;gap:9px;align-items:center;padding:8px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .chead .lab{font-weight:700;font-size:13px}
  .tag{font-size:11px;border-radius:9px;padding:1px 7px;border:1px solid var(--line);color:var(--dim)}
  /* 과목이 몇 개가 오든 색이 모자라지 않도록 6개를 돌려 쓴다(원래는 지Ⅰ/지Ⅱ 2개뿐이라 s1/s2만 있었다) */
  .tag.s1{background:#eef6ff;border-color:#bfdbfe;color:#1d4ed8}
  .tag.s2{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
  .tag.s3{background:#faf5ff;border-color:#e9d5ff;color:#7e22ce}
  .tag.s4{background:#fdf2f8;border-color:#fbcfe8;color:#be185d}
  .tag.s5{background:#f0f9ff;border-color:#bae6fd;color:#0369a1}
  .tag.s6{background:#f7f7f8;border-color:#d1d5db;color:#4b5563}
  .tag.ans{background:#fff7ed;border-color:#fed7aa;color:#c2410c;font-weight:700}
  .tag.part{background:#fefce8;border-color:#fde68a;color:var(--warn)}
  .chead .topic{font-size:11.5px;color:var(--dim);margin-left:auto}
  .cbody{padding:10px 11px;background:#fbfbfc}
  .cbody img{width:100%;max-width:min(100%,var(--preview-w));display:block;cursor:zoom-in;
             border:1px solid #eceff3;background:#fff}
  .empty{padding:40px;text-align:center;color:var(--dim)}

  /* ── 라이트박스 ──────────────────────────── */
  #lb{position:fixed;inset:0;background:rgba(15,18,22,.88);display:none;z-index:50;overflow:auto;padding:24px}
  #lb.on{display:block}
  #lb img{display:block;margin:0 auto;background:#fff;max-width:none}
  #lb .close{position:fixed;top:14px;right:18px;color:#fff;font-size:26px;background:none;border:none}
  #lb .zoom{position:fixed;top:14px;left:18px;display:flex;gap:6px}
  #lb .zoom button{padding:5px 11px;border-radius:6px;border:1px solid #4b5563;background:#1f2937;color:#fff}

  /* ── 문항집(인쇄) ───────────────────────── */
  #print{display:none;background:#fff}
  body.printing{background:#fff}
  body.printing #app{display:none}
  body.printing #print{display:block}
  .pbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;align-items:center;z-index:9}
  .pbar button{padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:#fff}
  .pbar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .paper{width:210mm;height:297mm;margin:14px auto;padding:12mm;background:#fff;
         box-shadow:0 1px 6px rgba(0,0,0,.15);overflow:hidden;position:relative}
  .ptitle{text-align:center;font-size:17px;font-weight:800;margin:0 0 3mm}
  .psub{text-align:center;font-size:10.5px;color:#4b5563;margin:0 0 5mm;padding-bottom:3mm;border-bottom:1.5px solid #111;line-height:1.5}
  .psub .meta{display:block;font-size:9.5px;color:var(--dim);margin-top:1mm}
  .sheet{display:flex;gap:9mm;align-items:flex-start}
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;row-gap:var(--g,5mm)}
  .pageno{position:absolute;bottom:6mm;left:0;right:0;text-align:center;font-size:9.5px;color:var(--dim)}
  #measure{position:absolute;left:-99999px;top:0;visibility:hidden}
  .pq .h{display:flex;gap:6px;align-items:baseline;font-size:10.5px;margin-bottom:1.5mm;color:#374151}
  .pq .h .no{font-weight:800;font-size:12px;color:#111}
  .pq .h .ex{color:var(--dim)}
  .pq .h .an{margin-left:auto;font-weight:800;color:#c2410c}
  .pq img{width:100%;height:auto;display:block}

  /* ── ④ 문항 번호 덧씌우기 ─────────────────────────────
     원본 크롭 이미지는 절대 고치지 않는다. items 의 number_box(이미지 크기 대비 0~1 비율)
     자리에 흰 상자를 덮고 그 위에 새 번호를 그린다. 비율이라 이미지를 어떤 폭으로 그리든
     (화면 미리보기 / 인쇄 88.5mm 단) 같은 자리에 겹친다.
     새 번호를 오른쪽 정렬하는 이유: 원래 번호의 오른쪽 끝이 발문과의 간격을 정한다.
     오른쪽을 맞춰야 두 자리 수가 돼도 왼쪽으로만 자라 그 간격이 유지된다.
     print-color-adjust:exact 가 꼭 필요하다 — 인쇄 대화상자의 '배경 그래픽'이 꺼져 있으면
     흰 상자가 안 칠해져 원래 번호가 그대로 비친다. */
  .qwrap{position:relative;display:block}
  /* 오른쪽 끝(right)으로 붙이고 폭은 자동이다. 원래 번호가 한 자리인데 새 번호가 두 자리면
     상자보다 넓어지는데, left+width 로 못 박으면 그 자리에서 앞자리가 잘린다
     (실측 사고: 원래 '4.' 였던 문항의 새 번호 '16' 이 '6' 으로 보였다).
     min-width 는 '원래 번호를 덮는 데 필요한 폭' 이라 짧아질 때도 자국이 안 남는다. */
  .renum{position:absolute;display:flex;align-items:center;justify-content:flex-end;
         width:auto;white-space:nowrap;
         background:#fff;color:#111;font-weight:800;line-height:1;overflow:hidden;
         -webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* ── ② 머리말·꼬리말 (인쇄면 전용) ─────────────────────
     .paper 안에 있으므로 인쇄된다. 반대로 저작권 안내·출처 표기는 body 직속 자식이라
     @media print 의 body>*{display:none} 에 걸려 인쇄면에 절대 안 나온다. 자리가 서로
     달라서 "머리말은 나오고 출처는 안 나온다"가 규칙 하나 안 건드리고 동시에 성립한다.
     .pheadwrap 으로 한 겹 싸는 이유는 순전히 실측 때문이다 — margin 은 부모 밖으로
     흘러나가(margin collapsing) getBoundingClientRect 에 안 잡힌다. 조판기는 이 높이를
     페이지 용량에서 빼야 하므로, 간격을 margin 이 아니라 바깥 상자의 padding 으로 준다. */
  .pheadwrap{padding-bottom:3mm}
  .phead{display:flex;gap:6mm;align-items:flex-end;font-size:10px;color:#111;
         padding-bottom:1.5mm;border-bottom:.6pt solid #9ca3af}
  .phead .ptxt{font-weight:700}
  .phead .pblank{margin-left:auto;display:flex;gap:7mm;color:#374151;white-space:nowrap}
  .phead .pblank u{display:inline-block;min-width:24mm;text-decoration:none;
                   border-bottom:.6pt solid #6b7280}
  /* 꼬리말은 쪽번호와 같은 아래 여백대에 절대 위치로 놓는다(본문 흐름을 안 건드린다).
     대신 조판기가 그 높이를 용량에서 빼 준다 — 안 그러면 마지막 문항과 겹친다. */
  .pfoot{position:absolute;left:12mm;right:12mm;bottom:11mm;text-align:center;
         font-size:9px;color:#4b5563}
  /* 조판기는 꼬리말 높이를 재서 페이지 용량에서 뺀다. 그런데 재는 곳(#measure)에서도
     position:absolute 이면 흐름 밖으로 빠져 감싼 상자 높이가 0 으로 나온다 —
     실측 사고: 그래서 용량에서 2mm(FOOT_RESERVE)만 빠졌고 마지막 문항이 꼬리말과
     0.8mm 겹쳤다. 재는 동안만 흐름 안으로 되돌린다. */
  #measure .pfoot{position:static;left:auto;right:auto;bottom:auto}

  /* ── ①③⑤ 편집 화면의 새 조작줄 ───────────────────────
     클래스 이름은 허브(hub-dashboard.css)가 쓰지 않는 것만 골랐다. .card/.label/.count/
     .group/.value/.sub/.detail/.section 따위는 전역 !important 규칙이 걸려 있어서
     배포본에서만 모양이 달라진다(이 파일 위쪽 정답표 주석과 같은 사고다). */
  .opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;
        border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-top:8px}
  .opts label{font-size:12.5px;display:inline-flex;gap:5px;align-items:center;color:#374151}
  .opts select,.opts input[type=text]{font:inherit;font-size:12.5px;padding:5px 7px;
        border:1px solid var(--line);border-radius:6px;background:#fff}
  .opts select:disabled{opacity:.5}
  .note{flex-basis:100%;font-size:11.5px;color:var(--warn);margin:0}
  /* ── 정답표 ─────────────────────────────────
     읽는 표가 아니라 훑는 표다. 세로 공간이 곧 비용이라 문항 조판보다 훨씬 조인다.

     !important 가 붙은 이유(습관이 아니라 실측이다): 이 문서가 위키로 배포되면
     빌드 뒤 hub-design-assets 주입이 hub-dashboard.css 를 물려 놓는데, 그 안의
     body[data-hub-ui] th,td{padding:10px 14px!important; text-align:left!important;
     vertical-align:top!important; border-bottom:…!important} 와
     body[data-hub-ui] th{position:sticky!important; font-size:11px!important;
     color:#999!important; text-transform:uppercase!important} 가 이 표를 그대로 덮는다.
     실측 결과 셀 하나가 19px → 56px 로 부풀어 10문항 블록이 15.7mm → 44.9mm 가 됐고
     40문항 문항집이 8쪽 → 9쪽이 됐다. important 선언은 특이도만으로 못 이기므로
     이쪽도 important 로 되받아야 한다. 선택자를 .pq.akey 로 둘 겹친 것도 같은 이유
     (특이도 (0,2,1) > 허브의 (0,1,2)). 스킬 저장소 사본은 허브가 없어도 값이 같다. */
  .akey h3{font-size:10.5px;line-height:1.3;margin:0 0 1.2mm;padding-top:1.2mm;border-top:1.2pt solid #111}
  .akey table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:9.5px;line-height:1.25}
  .pq.akey th,.pq.akey td{border:1px solid #999 !important;padding:.5px 0 !important;
    text-align:center !important;vertical-align:middle !important;overflow:hidden}
  .pq.akey th{background:#f2f4f7 !important;color:#111 !important;font-weight:700 !important;
    font-size:9px !important;letter-spacing:0 !important;text-transform:none !important;
    position:static !important}
  /* 행제목이 '번'/'호' 로 밀리면 표가 통째로 한 줄 높아진다. 폭은 실측 기준 —
     본문 폰트에서 '정답' 이 9px 일 때 18.4px 이고 8mm 는 30.2px 이라 64% 여유다.
     nowrap 을 여기에만 거는 이유: 값 칸까지 걸면 긴 정답(예: '정답없음')이 줄바꿈 대신
     소리 없이 잘린다. 행제목은 고정 어휘 세 개뿐이라 잘릴 일이 없다. */
  .pq.akey th.rh{width:8mm;white-space:nowrap}
  /* 원문자 ①~⑤ 는 인쇄해서 눈으로 읽는 알맹이라 여기만 키운다.
     한 칸이 15.2px(=(88.5-8)mm/20), 글자가 10.5px 이라 35% 여유. */
  .pq.akey td.an{font-size:10.5px}
  /* 조판기는 .pq 를 전부 같은 '문항 덩어리'로 보고 한 단에 row-gap 하나만 준다.
     정답표 블록끼리만 붙이려면 그 간격을 도로 빼는 수밖에 없다. --g/--kg 는 조판기가
     .col 인라인 스타일로 넣는다(단일 출처는 JS 의 KEY_GAP). 시트 밖에서는 둘 다 0. */
  .pq.akey + .pq.akey{margin-top:calc(var(--kg,0mm) - var(--g,0mm))}

  @media print{
    /* margin:0 이라야 브라우저가 머리글·바닥글(URL·날짜)을 넣을 자리가 없어진다.
       여백은 .paper 의 padding 으로 직접 준다. */
    @page{size:A4;margin:0}
    html,body{background:#fff}
    /* 허브 내비(hub-nav.js가 body.prepend로 넣는다) 등 문항집 밖 요소는 전부 제외 */
    body > *{display:none !important}
    body > #print{display:block !important}
    .pbar{display:none !important}
    .paper{width:210mm;height:297mm;margin:0;padding:12mm;box-shadow:none;overflow:hidden;
           break-after:page;page-break-after:always}
    .paper:last-child{break-after:auto;page-break-after:auto}
  }
</style>
</head>
<body>

<!-- 인쇄 제외 · 편집 화면 상단 한 줄 저작권 안내. body 직속 자식이라 print 시 자동 숨김(위 CSS 주석 참조) -->
<div id="notice">생성된 문항집은 수업 목적 범위에서만 사용하세요. 원저작권은 한국교육과정평가원(KICE)·EBS에 있습니다.</div>

<div id="app">
  <aside>
    <h1>기출 문항집 제작기<span style="display:block;font-size:11px;color:var(--dim);font-weight:400;margin-top:2px">왼쪽 탭에서 단원·성취기준을 고르면 문항이 함께 담깁니다</span></h1>
    <div class="tabs" id="tabs"></div>
    <div class="sidebtn">
      <button id="clearBtn" onclick="clearStds()">성취기준 전체 해제</button>
    </div>
    <div id="tree"></div>
  </aside>

  <main>
    <div class="bar">

<!-- 인쇄 제외 · 출처 표기. body 직속 자식이라 print 시 자동 숨김(위 CSS 주석 참조). 내용은 build.py 가 DATA.meta 로 채운다 -->
<footer id="attribution"></footer>

<script>
const DATA = /*__DATA__*/null;
let tab = 0;
const picked = new Set();          // 선택된 성취기준 코드
const off = new Set();             // 체크 해제된 문항 key
let lbScale = 1;

const stdsOf = (s) => s.units.flatMap(u => u.standards);
const findStd = (code) => DATA.subjects.flatMap(stdsOf).find(x => x.code === code);

// 성취기준 코드 -> {과목, 단원, 문장}
const META = {};
DATA.subjects.forEach(s => s.units.forEach(u => u.standards.forEach(st => {
  META[st.code] = { subject: s.name, unit: u.unit, text: st.text };
})));

/* ── 부속 데이터: 본문·번호상자·오답률 ─────────────────────
   셋 다 "문항 하나당 한 벌"인데, questions 배열은 성취기준마다 같은 문항을 되풀이해
   담는다(한 문항이 여러 성취기준에 걸린다). 행 안에 넣으면 JSON 이 그만큼 부푼다 —
   그래서 key -> 값 옆표로 따로 싣는다. 빌드가 안 실어 주면 빈 객체이고, 아래 기능들은
   조용히 꺼진다(있으면 켜지고 없으면 숨는다 — 없다고 죽지 않는다). */
const TEXT = DATA.text || {};
const NBOX = DATA.nbox || {};
const ERR  = DATA.err  || {};
const HAS_TEXT = Object.keys(TEXT).length > 0;
const HAS_ERR  = Object.keys(ERR).length > 0;

/* 검색 색인. 원문 소문자판과 공백 제거판을 미리 만들어 둔다 —
   한국어는 띄어쓰기가 흔들려서('해수의 염분' / '해수의염분') 공백 제거판이 없으면
   멀쩡한 낱말이 안 걸린다. 문항 수가 수백이라 매 입력마다 다시 만들면 느리다. */
const HAY = new Map();
for (const k of Object.keys(TEXT)) {
  const s = String(TEXT[k]).toLowerCase();
  HAY.set(k, [s, s.replace(/\s+/g, '')]);
}
// 본문이 없는 문항은 여기서 false 다. 조용히 빠지면 사용자는 그 문항이 없는 줄 알기 때문에
// 몇 개가 검색 대상 밖인지 filterNote 로 화면에 적는다.
const hitsQuery = (key, toks) => {
  const h = HAY.get(key);
  if (!h) return false;
  return toks.every(t => h[0].includes(t) || h[1].includes(t.replace(/\s+/g, '')));
};

// ── 회차 필터 ─────────────────────────────
// 시험 종류의 순서·약칭은 대한민국 수능 체계 자체가 고정 어휘라(scripts/common/ids.py 의
// EXAM_ALIASES·exam_sort_key 와 동일 어휘) 여기 하드코딩해도 CONTRACT 0절의 "과목 하드코딩 금지"에
// 걸리지 않는다 — 과목이 아니라 "시험 일정"이라서 그렇다. 새 과목이 와도 이 표는 안 바뀐다.
const KIND_RANK = { '3월학평': 0, '4월학평': 1, '5월학평': 2, '6월모평': 3, '6월학평': 4, '7월학평': 5, '9월모평': 6, '9월학평': 7, '10월학평': 8, '수능': 9, '11월학평': 10 };
const KIND_LABEL = { '3월학평': '3월학평', '4월학평': '4월학평', '5월학평': '5월학평', '6월모평': '6월모평', '6월학평': '6월학평', '7월학평': '7월학평', '9월모평': '9월모평', '9월학평': '9월학평', '10월학평': '10월학평', '수능': '수능', '11월학평': '11월학평' };
const ALL_Q = DATA.subjects.flatMap(s => s.units).flatMap(u => u.standards).flatMap(s => s.questions);
// 학평은 같은 달에 학년별(고1/고2/고3) 시험이 따로 있어서 학년까지 키에 넣어야 회차가 안 섞인다.
const examKey = (q) => `${q.year}_${q.grade || ''}_${q.exam}`;
// 실제로 존재하는 회차만 시간순으로 늘어놓는다(예: 2027은 6월모평뿐)
const EXAMS = [...new Map(ALL_Q.map(q => [examKey(q), q])).values()]
  .sort((a, b) => a.year - b.year || KIND_RANK[a.exam] - KIND_RANK[b.exam] || (a.grade || 0) - (b.grade || 0))
  .map(q => ({ key: examKey(q), year: q.year, exam: q.exam, grade: q.grade,
               label: `${q.year}${q.grade ? ' 고' + q.grade : ''} ${KIND_LABEL[q.exam]}` }));
const EXAM_POS = new Map(EXAMS.map((e, i) => [e.key, i]));
const KINDS = [...new Set(EXAMS.map(e => e.exam))].sort((a, b) => KIND_RANK[a] - KIND_RANK[b]);
// 과목 표시 순서는 --subject 로 지정한 순서를 그대로 따른다(build.py 가 DATA.subjectOrder 로 넘겨준다).
// 예전엔 "'Ⅰ'로 끝나는 과목이 항상 먼저"였는데, 지구과학 전용 가정이라 다른 과목 조합에서 깨진다.
const subjectRank = (name) => { const i = (DATA.subjectOrder || []).indexOf(name); return i === -1 ? 999 : i; };
const SUBJECTS = [...new Set(ALL_Q.map(q => q.subject))].sort((x, y) => subjectRank(x) - subjectRank(y));
const SHORT = new Map(ALL_Q.map(q => [q.subject, q.short]));  // 필터 칩에 쓸 과목 약칭
const F = { from: 0, to: EXAMS.length - 1, kinds: new Set(KINDS), subjects: new Set(SUBJECTS),
            q: '', tok: [], err: 0 };   // q=검색어 원문, tok=소문자 낱말들, err=오답률 하한(%)

// 기간·시험종류·과목만 보는 1차 통과. 검색과 오답률은 이 위에 겹쳐 건다 —
// '검색 때문에 빠진 게 몇 개인가'를 세려면 그 둘을 뺀 모집단이 따로 필요하다.
const passBase = (q) => {
  const i = EXAM_POS.get(examKey(q));
  return i >= F.from && i <= F.to && F.kinds.has(q.exam) && F.subjects.has(q.subject);
};
const passFilter = (q) => {
  if (!passBase(q)) return false;
  // 오답률 하한을 걸면 오답률을 모르는 문항은 빠진다. 몇 개가 그렇게 빠졌는지도 화면에 적는다.
  if (F.err > 0 && !(typeof ERR[q.key] === 'number' && ERR[q.key] >= F.err)) return false;
  if (F.tok.length && !hitsQuery(q.key, F.tok)) return false;
  return true;
};

function onRange(which){
  const a = document.getElementById('fromIdx'), b = document.getElementById('toIdx');
  F.from = +a.value; F.to = +b.value;
  if (F.from > F.to) {                       // 두 손잡이가 교차하면 민 쪽을 따라간다
    if (which === 0) { F.to = F.from; b.value = F.to; }
    else { F.from = F.to; a.value = F.from; }
  }
  drawFilter(); drawTree(); render();
}
function toggleKind(k){ F.kinds.has(k) ? (F.kinds.size > 1 && F.kinds.delete(k)) : F.kinds.add(k);
  drawFilter(); drawTree(); render(); }
function toggleSubj(s){ F.subjects.has(s) ? (F.subjects.size > 1 && F.subjects.delete(s)) : F.subjects.add(s);
  drawFilter(); drawTree(); render(); }
function resetFilter(){
  F.from = 0; F.to = EXAMS.length - 1;
  F.kinds = new Set(KINDS); F.subjects = new Set(SUBJECTS);
  F.q = ''; F.tok = []; F.err = 0;
  drawFilter(); drawTree(); render();
}

/* ── ③ 문항 검색 / ⑤ 오답률 하한 ──────────────────────
   둘 다 단원(성취기준) 선택과 **교집합**으로 걸린다 — currentQuestions() 가 고른
   성취기준의 문항만 훑고 거기에 passFilter 를 다시 통과시키기 때문이다. */
const queryTokens = (s) => String(s || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
function onSearch(){
  F.q = document.getElementById('qSearch').value;
  F.tok = queryTokens(F.q);
  drawFilter(); drawTree(); render();
}
function clearSearch(){ document.getElementById('qSearch').value = ''; onSearch(); }
function onErr(){
  F.err = +document.getElementById('errMin').value;
  drawFilter(); drawTree(); render();
}

// 지금 조건에서 '검색·오답률 때문에' 빠진 문항이 몇 개인지 한 줄로 알린다.
// 모집단은 고른 성취기준의 문항(아무것도 안 골랐으면 전체), 중복 제거.
function poolQuestions(){
  const src = picked.size
    ? [...picked].flatMap(c => (findStd(c) || { questions: [] }).questions)
    : ALL_Q;
  const seen = new Set(), out = [];
  for (const q of src) if (!seen.has(q.key)) { seen.add(q.key); out.push(q); }
  return out;
}
function filterNotes(){
  const msgs = [];
  const pool = (F.tok.length || F.err > 0) ? poolQuestions().filter(passBase) : [];
  if (F.tok.length) {
    const n = pool.filter(q => !HAY.has(q.key)).length;
    if (n) msgs.push(`본문 없음 ${n}개는 검색 대상이 아닙니다(선택지가 그림이거나 텍스트 레이어가 없는 회차).`);
  }
  if (F.err > 0) {
    const n = pool.filter(q => typeof ERR[q.key] !== 'number').length;
    if (n) msgs.push(`오답률 정보 없는 ${n}개는 제외됐습니다.`);
  }
  return msgs.join(' ');
}
function drawFilter(){
  const a = document.getElementById('fromIdx'), b = document.getElementById('toIdx');
  a.max = b.max = EXAMS.length - 1; a.value = F.from; b.value = F.to;
  document.getElementById('fromLab').textContent = EXAMS[F.from].label;
  document.getElementById('toLab').textContent = EXAMS[F.to].label;
  document.getElementById('kindChips').innerHTML = KINDS.map(k =>
    `<button class="chip ${F.kinds.has(k) ? 'on' : ''}" onclick="toggleKind('${k}')">${KIND_LABEL[k]}</button>`).join(' ');
  document.getElementById('subjChips').innerHTML = SUBJECTS.map(s =>
    `<button class="chip ${F.subjects.has(s) ? 'on' : ''}" onclick="toggleSubj('${s}')">${esc(SHORT.get(s) || s)}</button>`).join(' ');
  const kept = EXAMS.filter((e, i) => i >= F.from && i <= F.to && F.kinds.has(e.exam)).length;
  const full = F.from === 0 && F.to === EXAMS.length - 1 &&
               F.kinds.size === KINDS.length && F.subjects.size === SUBJECTS.length &&
               !F.tok.length && !F.err;
  document.getElementById('filterHit').textContent = full ? '전체 회차' : `회차 ${kept}/${EXAMS.length}개`;
  // 검색·오답률 칸은 데이터가 없으면 통째로 숨어 있다(initExtras). 있을 때만 되쓴다.
  const se = document.getElementById('qSearch');
  if (se && se.value !== F.q) se.value = F.q;
  const ee = document.getElementById('errMin');
  if (ee) {
    ee.value = F.err;
    document.getElementById('errLab').textContent = F.err ? `${F.err}% 이상` : '전체';
  }
  document.getElementById('filterNote').textContent = filterNotes();
}

// 데이터 정렬(--subject 로 지정한 과목 순서 → 각 과목 안에서는 과거→현재) 순서를 전역 순위로 굳혀 둔다
const RANK = new Map();
DATA.subjects.flatMap(stdsOf).flatMap(s => s.questions)
  .forEach(q => { if (!RANK.has(q.key)) RANK.set(q.key, RANK.size); });

function currentQuestions(){
  const seen = new Set(), out = [];
  for (const code of picked) {
    const std = findStd(code);
    if (!std) continue;
    for (const q of std.questions)
      if (!seen.has(q.key) && passFilter(q)) { seen.add(q.key); out.push(q); }
  }
  const ov = document.getElementById('order')?.value || '1';
  if (ov === 'err') {
    // 오답률 순은 과목 블록보다 오답률이 앞선다 — 그게 이 정렬을 고른 이유다.
    // 오답률을 모르는 문항은 -1 로 두어 뒤로 밀린다(필터로 빠지지 않은 경우).
    const e = (q) => (typeof ERR[q.key] === 'number' ? ERR[q.key] : -1);
    out.sort((a, b) => e(b) - e(a) || RANK.get(a.key) - RANK.get(b.key));
    return out;
  }
  const dir = +ov;
  const si = (q) => subjectRank(q.subject);   // 과목 블록은 --subject 순서 그대로, 항상 뒤섞이지 않는다
  out.sort((a, b) => si(a) - si(b) || (RANK.get(a.key) - RANK.get(b.key)) * dir);
  return out;
}
const chosen = () => currentQuestions().filter(q => !off.has(q.key));
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 사이드바 ─────────────────────────────── */
function drawTabs(){
  document.getElementById('tabs').innerHTML = DATA.subjects.map((s, i) =>
    `<button class="${i===tab?'on':''}" onclick="tab=${i};drawTree()">${s.name}</button>`).join('');
}
function drawTree(){
  drawTabs();
  const btn = document.getElementById('clearBtn');
  if (btn) { btn.disabled = !picked.size;
    btn.textContent = picked.size ? `성취기준 전체 해제 (${picked.size})` : '성취기준 전체 해제'; }
  document.getElementById('tree').innerHTML = DATA.subjects[tab].units.map(u => `
    <div class="unit">${u.unit}</div>
    ${u.standards.map(st => {
      const n = st.questions.filter(passFilter).length;
      return `<div class="std ${picked.has(st.code)?'on':''}" onclick="toggleStd('${st.code}')">
        <input type="checkbox" ${picked.has(st.code)?'checked':''} tabindex="-1">
        <span><span class="code">${st.code}</span><span class="txt">${esc(st.text||'')}</span></span>
        <span class="cnt ${n?'':'zero'}">${n}</span>
        <button class="only" onclick="event.stopPropagation();onlyStd('${st.code}')">이것만</button>
      </div>`;
    }).join('')}`).join('');
}

// 행 어디를 눌러도 누적 토글. 추가할 때는 방금 담긴 문항으로 스크롤한다.
function toggleStd(code){
  const before = new Set(currentQuestions().map(q => q.key));
  picked.has(code) ? picked.delete(code) : picked.add(code);
  drawTree(); render();
  const added = currentQuestions().find(q => !before.has(q.key));
  if (added) revealCard(added.key);
}
function clearStds(){ picked.clear(); off.clear(); drawTree(); render(); }
function onlyStd(code){
  picked.clear(); picked.add(code); drawTree(); render();
  const first = currentQuestions()[0];
  if (first) revealCard(first.key);
}
function revealCard(key){
  requestAnimationFrame(() => {
    const el = document.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1500);
  });
}

function selAll(on){ currentQuestions().forEach(q => on ? off.delete(q.key) : off.add(q.key)); render(); }
function selInvert(){ currentQuestions().forEach(q => off.has(q.key) ? off.delete(q.key) : off.add(q.key)); render(); }
function toggleQ(key){ off.has(key) ? off.delete(key) : off.add(key); render(); }

function render(){
  const qs = currentQuestions();
  const inline = document.getElementById('optAnsInline').checked;
  document.getElementById('count').textContent =
    qs.length ? `선택 ${chosen().length} / 후보 ${qs.length}문항` : '';
  document.getElementById('title').placeholder = picked.size ? autoTitle() : '문항집 제목';
  document.getElementById('list').innerHTML = qs.length ? qs.map(q => `
    <div class="card ${off.has(q.key)?'off':''}" data-key="${q.key}">
      <div class="chead">
        <input type="checkbox" ${off.has(q.key)?'':'checked'} onchange="toggleQ('${q.key}')">
        <span class="tag s${(subjectRank(q.subject) % 6) + 1}">${esc(q.short)}</span>
        <span class="lab">${esc(q.label)}</span>
        <span class="tag">${q.points}점</span>
        ${inline && q.answer ? `<span class="tag ans">정답 ${q.answer}</span>` : ''}
        ${q.fit==='부분' ? '<span class="tag part">부분 대응</span>' : ''}
        ${typeof ERR[q.key] === 'number' ? `<span class="tag">오답률 ${ERR[q.key]}%</span>` : ''}
        <span class="topic">${esc(q.topic)}</span>
      </div>
      <div class="cbody"><img src="${q.img}" alt="${esc(q.label)}" loading="lazy" onclick="openLb(this.src)"></div>
    </div>`).join('')
    : '<div class="empty">왼쪽에서 성취기준을 고르세요. 여러 개를 고르면 함께 담깁니다.</div>';
  drawOpts();
}

/* ── 인쇄 옵션 줄의 상태 표시 ────────────────────────────
   ④ number_box 가 아직 없는 문항이 있을 수 있다(다른 공정이 만드는 중이다).
   그런 문항은 원래 번호를 그대로 두고, 몇 개가 그런지 여기서 알린다. */
function drawOpts(){
  const sp = document.getElementById('optSpace'), sa = document.getElementById('spaceAmt');
  if (sp && sa) sa.disabled = !sp.checked;
  const note = document.getElementById('renumNote');
  const rn = document.getElementById('optRenum');
  if (!note || !rn) return;
  if (!rn.checked) { note.textContent = ''; return; }
  if (!Object.keys(NBOX).length) {
    note.textContent = '번호 위치 데이터(number_box)가 아직 없습니다 — 모든 문항이 원래 번호 그대로 나옵니다.';
    return;
  }
  const n = chosen().filter(q => !NBOX[q.key]).length;
  note.textContent = n ? `번호 위치를 모르는 ${n}개 문항은 원래 번호 그대로 나옵니다.` : '';
}

/* ── 라이트박스 ───────────────────────────── */
function openLb(src){ lbScale = 1; const i = document.getElementById('lbimg');
  i.src = src; i.style.width = ''; document.getElementById('lb').classList.add('on'); }
function closeLb(){ document.getElementById('lb').classList.remove('on'); }
function zoom(d){ const i = document.getElementById('lbimg');
  if (d === 0) { lbScale = 1; i.style.width = ''; return; }
  lbScale = Math.min(4, Math.max(.4, lbScale + d * .25));
  i.style.width = (i.naturalWidth * lbScale) + 'px'; }
addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

/* ── 문항집 조판 ──────────────────────────── */
// A4 210×297, 상하좌우 12mm 여백, 단 간격 9mm
const MM = 96 / 25.4, PAGE_H = 273, COL_W = (210 - 24 - 9) / 2;
const GAP_MIN = 5, GAP_MAX = 26;
// 정답표 한 블록의 최대 문항 수. 단 폭 88.5mm 에서 행제목 8mm 를 빼고 20칸으로 나누면
// 한 칸이 15.2px, 원문자 한 글자가 10.5px 이라 35% 여유가 남는다(실측). 24칸이면 11% 뿐이다.
// 20 은 탐구 한 회차의 문항 수이기도 해서 한 회차가 블록 하나로 떨어진다.
const KEY_MAX = 20;
// 정답표 블록 사이 간격(mm). 문항 사이 규칙(GAP_MIN~GAP_MAX)을 여기에 그대로 쓰면
// 40문항에서 표 사이로만 15mm 가 샜다. CSS 로는 .col 의 --kg 로 내려간다.
const KEY_GAP = 1.2;
// ① 문항 아래 풀이 공간(mm). 기본은 꺼짐 — 사용자 지시("웬만하면 여백 충분하다").
const SPACE_MM = { s: 8, m: 14, l: 22 };
// ④ 번호 상자 여유. 이미지 크기 대비 비율이다. 상자를 사방으로 이만큼 넓혀 원래 번호의
//    안티에일리어싱 잔털까지 덮고, 오른쪽은 padding-right 로 같은 값을 도로 밀어
//    글자의 오른쪽 끝이 '원래 번호의 오른쪽 끝'에 그대로 서게 한다.
const NB_PAD = 0.004;
/* 상자 높이 -> 글자 크기. number_box 는 '번호가 실제로 차지하는 자리' 이므로 그 높이는
   숫자의 잉크 높이(대문자 높이)다. 글꼴에서 대문자 높이는 대략 font-size 의 0.70 배라
   1/0.70 ≒ 1.43 을 곱해야 원래 크기가 나오는데, 만드는 쪽이 상자에 여유를 조금 넣었을
   수 있어 1.25 로 낮춰 잡았다(실측: 0.78 로 뒀더니 원래 번호보다 눈에 띄게 작았다).
   새 번호에 마침표를 안 붙이는 이유도 같은 불확실성 때문이다 — 상자가 '1.' 의 마침표까지
   포함하는지 '1' 까지인지는 만드는 쪽에 달렸는데, 마침표를 뺀 상자에 '1.' 을 오른쪽
   정렬하면 숫자가 원래 자리에서 왼쪽으로 밀린다. 숫자만 그리면 어느 쪽이든 자리가 맞는다. */
const NB_FONT_RATIO = 1.25;
// 꼬리말은 절대 위치라 본문 흐름 밖이지만, 본문 영역과 1mm 겹친다(본문 아래끝 12mm,
// 꼬리말 아래끝 11mm). 겹침 방지 여유까지 더해 2mm 를 페이지 용량에서 뺀다.
const FOOT_RESERVE = 2;

const pct = (v) => (v * 100).toFixed(3) + '%';

// 이미지 + (④가 켜졌고 number_box 가 있으면) 번호 덮개.
const imgHtml = (q, clamp, renum) => {
  const img = `<img src="${q.img}" alt=""${clamp ? ` style="height:${clamp}mm;width:auto"` : ''}>`;
  if (!renum) return img;
  const b = renum.box;
  // 오른쪽 끝을 못으로 박는다 — 원래 번호의 오른쪽 끝이 발문과의 간격을 정하기 때문이다.
  // 좌우로 NB_PAD 만큼 넓힌 뒤 같은 값을 padding 으로 도로 밀어, 글자의 오른쪽 끝이
  // '원래 번호의 오른쪽 끝' 에 정확히 선다(box-sizing:border-box 라 계산이 맞아떨어진다).
  const R = Math.min(1, b[0] + b[2] + NB_PAD);
  const T = Math.max(0, b[1] - NB_PAD);
  const H = Math.min(1 - T, b[3] + NB_PAD * 2);
  const W = Math.min(R, b[2] + NB_PAD * 2);   // 최소 폭 = 원래 번호를 덮는 폭
  // font 는 조판 단 폭으로 실제로 그려 본 이미지 높이에서 계산한 mm 값이다(makeSheet 참조).
  // 부모 높이의 %를 font-size 로 쓸 수 없어서 CSS 만으로는 안 된다.
  const f = renum.font ? `font-size:${renum.font.toFixed(2)}mm;` : '';
  return `<span class="qwrap">${img}<span class="renum" style="right:${pct(1 - R)};top:${pct(T)};`
       + `min-width:${pct(W)};height:${pct(H)};padding:0 ${pct(NB_PAD)};${f}">${renum.n}</span></span>`;
};

/* pad(풀이 공간)를 문항 사이 '간격'이 아니라 문항 블록의 padding-bottom 으로 주는 이유:
   ① 조판기가 재는 hs[i] 에 그대로 포함돼 쪽 넘김 계산이 저절로 맞는다.
   ② 단의 마지막 문항 아래에도 공간이 남는다(간격으로 주면 거기만 안 생긴다).
   pad 가 0 이면 속성 자체를 안 붙인다 — 기능을 다 끈 상태의 출력이 예전과 글자까지 같아야 한다. */
const qHtml = (q, i, inline, clamp, pad, renum) => `
  <div class="pq"${pad ? ` style="padding-bottom:${pad}mm"` : ''}>
    <div class="h">
      <span class="no">${i + 1}.</span>
      <span class="ex">${q.short} ${esc(q.label)}</span>
      <span class="ex">[${q.points}점]</span>
      ${inline && q.answer ? `<span class="an">정답 ${q.answer}</span>` : ''}
    </div>
    ${imgHtml(q, clamp, renum)}
  </div>`;

/* ② 머리말·꼬리말. 인쇄면(.paper) 안에만 들어간다.
   ── 머리말은 '모든 쪽'에 넣는다 ──
   학습지는 스테이플 없이 낱장으로 복사·배부돼 흩어진다. 첫 쪽에만 있으면 둘째 장부터는
   무슨 유인물인지, 누구 반 것인지 알 수 없다. 쪽마다 한 줄이면 그 문제가 사라진다.
   ── 이름·날짜 기입란은 '첫 쪽에만' 둔다 ──
   쪽마다 빈칸이 나오면 학생은 매 쪽 써야 하는지 헷갈리고 채점자도 어느 칸이 진짜인지
   모른다. 이름은 한 번만 받는 게 맞다. 그래서 머리말과 기입란의 쪽 규칙을 일부러 다르게 뒀다.
   둘 다 기본값은 꺼짐이다 — 아무것도 안 건드린 오늘의 출력이 그대로여야 한다. */
const headerHtml = (text, blank, first) => {
  const showBlank = blank && first;
  if (!text && !showBlank) return '';
  return `<div class="pheadwrap"><div class="phead">`
       + `<span class="ptxt">${esc(text)}</span>`
       + (showBlank ? '<span class="pblank"><span>이름 <u></u></span><span>날짜 <u></u></span></span>' : '')
       + `</div></div>`;
};
const footerHtml = (text) => text ? `<div class="pfoot">${esc(text)}</div>` : '';

// 블록 수를 먼저 정하고 문항을 고르게 나눈다. KEY_MAX 씩 앞에서부터 자르면
// 41문항이 20/20/1 이 되어 마지막 표가 한 칸짜리로 남는다.
const keySplit = (n) => {
  const k = Math.max(1, Math.ceil(n / KEY_MAX));
  return Array.from({ length: k }, (_, i) => Math.floor(n / k) + (i < n % k ? 1 : 0));
};

// 정답표는 단 안쪽에 들어가야 하므로 여러 블록으로 끊는다(6-2: column-span 은 다단 밖으로 샌다).
const keyChunks = (qs) => {
  const out = [];
  let s = 0;
  for (const len of keySplit(qs.length)) {
    const part = qs.slice(s, s + len);
    out.push(`<div class="pq akey">
      ${s === 0 ? '<h3>정답</h3>' : ''}
      <table>
        <tr><th class="rh">번호</th>${part.map((_, j) => `<th>${s + j + 1}</th>`).join('')}</tr>
        <tr><th class="rh">정답</th>${part.map(q => `<td class="an">${q.answer || '-'}</td>`).join('')}</tr>
        <tr><th class="rh">배점</th>${part.map(q => `<td>${q.points || '-'}</td>`).join('')}</tr>
      </table></div>`);
    s += len;
  }
  return out;
};

const waitImgs = (root) => Promise.all([...root.querySelectorAll('img')].map(
  i => i.complete && i.naturalWidth ? null : new Promise(r => { i.onload = i.onerror = r; })));

// 제목을 비워 두면 선택한 성취기준의 과목·단원으로 만들어 준다.
function autoTitle(){
  const ms = [...picked].map(c => META[c]).filter(Boolean);
  if (!ms.length) return '문항집';
  const subs = [...new Set(ms.map(m => m.subject))];
  const units = [...new Set(ms.map(m => m.unit))];
  const head = subs.join(' · ');
  if (units.length === 1) return `${head} ${units[0]}`;
  if (units.length <= 3) return `${head} ${units.join(', ')}`;
  return `${head} 종합`;
}

function headHtml(qs, title, withMeta, withCodes){
  const codes = [...picked];
  const meta = withMeta ? codes.map(c => META[c]
    ? `<span class="meta">${esc(META[c].subject)} · ${esc(META[c].unit)}<br>${
        withCodes ? `[${c}] ` : ''}${esc(META[c].text)}</span>`
    : '').join('') : '';
  const lead = [withCodes ? esc(codes.join(' · ')) : '',
                `총 ${qs.length}문항`,
                `배점 합 ${qs.reduce((s, q) => s + (q.points || 0), 0)}점`]
               .filter(Boolean).join(' &nbsp;|&nbsp; ');
  return `<h2 class="ptitle">${esc(title)}</h2>
    <p class="psub">${lead}${meta}</p>`;
}

async function makeSheet(){
  const qs = chosen();
  if (!qs.length) { alert('선택된 문항이 없습니다.'); return; }
  const btn = document.querySelector('.bar button.primary');
  const label = btn.textContent; btn.textContent = '배치 계산 중…'; btn.disabled = true;

  const inline = document.getElementById('optAnsInline').checked;
  const withTable = document.getElementById('optAnsTable').checked;
  const withMeta = document.getElementById('optMeta').checked;
  const withCodes = document.getElementById('optCodes').checked;
  const maxPerCol = +document.getElementById('perPage').value;
  const pad = document.getElementById('optSpace').checked
    ? SPACE_MM[document.getElementById('spaceAmt').value] : 0;
  const renum = document.getElementById('optRenum').checked;
  const hdText = document.getElementById('hdText').value.trim();
  const hdBlank = document.getElementById('hdBlank').checked;
  const ftText = document.getElementById('ftText').value.trim();
  const hdr1 = headerHtml(hdText, hdBlank, true);    // 첫 쪽(이름·날짜 칸 포함)
  const hdrN = headerHtml(hdText, hdBlank, false);   // 둘째 쪽부터
  const foot = footerHtml(ftText);
  const title = document.getElementById('title').value.trim() || autoTitle();
  const head = headHtml(qs, title, withMeta, withCodes);
  const meas = document.getElementById('measure');

  // 1) 실제 단 너비로 그려서 높이를 잰다. 이미지 비율이 제각각이라 재보지 않으면 페이지가 넘치거나 빈다.
  const blocks = (clamps, fonts) => qs.map((q, i) => qHtml(
      q, i, inline, clamps && clamps[i], pad,
      renum && NBOX[q.key] ? { n: i + 1, box: NBOX[q.key], font: fonts && fonts[i] } : null))
    .concat(withTable ? keyChunks(qs) : []);
  const W = 210 - 24;   // 본문 폭(A4 - 좌우 여백). 머리말·꼬리말도 이 폭으로 잰다.
  const measure = async (clamps) => {
    meas.innerHTML = `<div style="width:${COL_W}mm">${blocks(clamps).join('')}</div>
                      <div style="width:${W}mm">${head}</div>
                      <div style="width:${W}mm">${hdr1}</div>
                      <div style="width:${W}mm">${hdrN}</div>
                      <div style="width:${W}mm">${foot}</div>`;
    await waitImgs(meas);
    const h = (n) => meas.children[n].getBoundingClientRect().height / MM;
    return {
      hs: [...meas.children[0].children].map(e => e.getBoundingClientRect().height / MM),
      headH: h(1), hdr1H: h(2), hdrNH: h(3),
      footH: foot ? h(4) + FOOT_RESERVE : 0,
    };
  };
  let { hs, headH, hdr1H, hdrNH, footH } = await measure(null);
  const broken = [...meas.querySelectorAll('img')].filter(i => !i.naturalWidth).length;
  if (broken) alert(`이미지 ${broken}개를 불러오지 못했습니다. 이 HTML을 폴더 밖으로 옮기면 그림 경로가 끊깁니다.`);

  // 한 문항이 페이지보다 큰 경우에만 그 문항의 이미지를 줄인다(그 외에는 단 폭 그대로).
  // 기준은 '머리말·꼬리말을 뺀 보통 쪽의 용량'이다. 기능을 다 끄면 FIT 는 그대로 PAGE_H 다.
  const FIT = PAGE_H - hdrNH - footH;
  let clamps = null;
  if (hs.some((h, i) => i < qs.length && h > FIT)) {
    clamps = qs.map((_, i) => {
      if (hs[i] <= FIT) return 0;
      const img = meas.children[0].children[i].querySelector('img');
      return img.getBoundingClientRect().height / MM - (hs[i] - FIT) - 2;
    });
    ({ hs, headH, hdr1H, hdrNH, footH } = await measure(clamps));
  }

  /* ④ 새 번호의 글꼴 크기. number_box 는 이미지 크기 대비 비율이라 CSS 만으로는 못 낸다
     (부모 높이의 %를 font-size 로 쓸 수 없다). 위에서 조판 단 폭(COL_W)으로 실제로 그려 본
     이미지 높이가 곧 인쇄될 높이라, 여기서 mm 로 계산하면 화면과 인쇄가 같은 값이 된다.
     반드시 meas 를 비우기 전에 읽어야 한다. */
  let fonts = null;
  if (renum) {
    // 폭 확인용 자. 실제로 그려 보고 재야 글꼴마다 다른 숫자 폭을 안 추측한다.
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0;white-space:nowrap;'
                        + 'font-weight:800;line-height:1';
    meas.appendChild(probe);
    fonts = qs.map((q, i) => {
      const b = NBOX[q.key];
      if (!b) return 0;
      const r = meas.children[0].children[i].querySelector('img').getBoundingClientRect();
      const wmm = r.width / MM;
      let f = b[3] * (r.height / MM) * NB_FONT_RATIO;
      /* 한 자리였던 번호 자리에 두 자리가 들어가면 상자가 왼쪽으로 자란다. 그런데 크롭은
         번호 바로 앞에서 잘려 있어 왼쪽 여유가 거의 없다 — 그대로 두면 숫자가 이미지 밖
         (단 사이 홈이나 종이 여백)에 찍힌다. 실측: 16문항 중 6개가 그랬다.
         넘칠 때만 그 문항의 글꼴을 줄인다. 안 넘치면 위에서 구한 크기 그대로다. */
      const avail = (Math.min(1, b[0] + b[2] + NB_PAD) - 2 * NB_PAD) * wmm;
      probe.style.fontSize = f.toFixed(2) + 'mm';
      probe.textContent = String(i + 1);
      const need = probe.getBoundingClientRect().width / MM;
      if (need > avail && need > 0) f *= avail / need;
      return f;
    });
    probe.remove();
  }
  meas.innerHTML = '';

  // 2) 단 → 페이지 순서로 채운다. 높이가 넘치거나 한 단의 문항 수 상한에 닿으면 다음 단으로.
  const items = blocks(clamps, fonts);
  const isKey = (i) => i >= qs.length;
  // 정답표 블록끼리 붙는 자리만 간격이 다르다. 앞이 문항이면(표의 첫 블록) 평소대로 띄운다 —
  // '정답' 제목줄이 절취선처럼 서야 문항과 표가 구분된다.
  const gapBefore = (i, prev) => (prev !== undefined && isKey(i) && isKey(prev)) ? KEY_GAP : GAP_MIN;
  const pages = [];
  let page = { cols: [[], []], used: [0, 0] }, col = 0;
  // 쪽 용량. 첫 쪽은 제목 블록과 '첫 쪽용 머리말', 나머지 쪽은 '이후 쪽용 머리말'을 뺀다.
  // 꼬리말은 모든 쪽에서 뺀다. 기능을 다 끄면 hdr1H·hdrNH·footH 가 0 이라 예전 식과 같다.
  const capOf = (pi) => PAGE_H - (pi === 0 ? headH + hdr1H : hdrNH) - footH;
  items.forEach((_, i) => {
    const cur = page.cols[col];
    const full = cur.length &&
      (page.used[col] + gapBefore(i, cur[cur.length - 1]) + hs[i] > capOf(pages.length) ||
       (!isKey(i) && cur.filter(x => !isKey(x)).length >= maxPerCol));
    if (full) {
      if (col === 0) col = 1;
      else { pages.push(page); page = { cols: [[], []], used: [0, 0] }; col = 0; }
    }
    // 단이 바뀌었을 수 있어 간격을 다시 잡는다(새 단의 첫 덩어리는 앞이 없으므로 0).
    const now = page.cols[col];
    page.used[col] += hs[i] + (now.length ? gapBefore(i, now[now.length - 1]) : 0);
    now.push(i);
  });
  pages.push(page);

  // 3) 단마다 남는 아래 여백을 '늘려도 되는' 간격에만 나눠 준다.
  //    정답표 블록 사이는 고정폭이라 분모에서 빠진다 — 안 그러면 방금 붙인 표가 도로 벌어진다.
  const gapOf = (pi, ci) => {
    const idx = pages[pi].cols[ci];
    const flex = idx.filter((it, k) => k > 0 && !(isKey(it) && isKey(idx[k - 1]))).length;
    if (!flex) return GAP_MIN;
    const extra = (capOf(pi) - pages[pi].used[ci]) / flex;
    return Math.min(GAP_MAX, GAP_MIN + Math.max(0, extra));
  };

  document.getElementById('pages').innerHTML = pages.map((pg, pi) => `
    <div class="paper">
      ${pi === 0 ? hdr1 : hdrN}
      ${pi === 0 ? head : ''}
      <div class="sheet">
        ${[0, 1].map(ci => `<div class="col" style="--g:${gapOf(pi, ci).toFixed(1)}mm;--kg:${KEY_GAP}mm">
            ${pg.cols[ci].map(i => items[i]).join('')}</div>`).join('')}
      </div>
      <div class="pageno">${pi + 1} / ${pages.length}</div>
      ${foot}
    </div>`).join('');

  await waitImgs(document.getElementById('pages'));
  document.title = sheetFileName(title, qs);
  document.getElementById('fnHint').textContent = document.title + '.pdf';
  btn.textContent = label; btn.disabled = false;
  document.body.classList.add('printing');
  scrollTo(0, 0);
}
// 브라우저는 'PDF로 저장' 파일명을 document.title 에서 가져온다.
const SAFE = (s) => s.replace(/[\/:*?"<>|]/g, ' ').replace(/\s+/g, ' ').trim();
function sheetFileName(title, qs){
  const d = new Date();
  const ymd = String(d.getFullYear()).slice(2) +
    String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  const withAns = document.getElementById('optAnsInline').checked ||
                  document.getElementById('optAnsTable').checked;
  return SAFE(`${title}_${qs.length}문항${withAns ? '_정답' : ''}_${ymd}`);
}

const PAGE_TITLE = document.title;
function backToEdit(){ document.body.classList.remove('printing'); document.title = PAGE_TITLE; }

/* ── 문항집 저장/불러오기 (브라우저 로컬) ─────────── */
const STORE = 'worksheet.sets.v1';
const readSets = () => { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); }
                         catch { return {}; } };
const writeSets = (s) => { try { localStorage.setItem(STORE, JSON.stringify(s)); return true; }
                           catch { alert('브라우저 저장 공간에 쓸 수 없습니다(사생활 보호 모드일 수 있습니다).'); return false; } };
const opt = (id) => document.getElementById(id);
// 저장 묶음의 opts 는 **위치**로 읽힌다. 새 항목은 반드시 뒤에만 붙인다.
const OPT_IDS = ['optAnsInline', 'optAnsTable', 'optCodes', 'optMeta',
                 'optSpace', 'optRenum', 'hdBlank'];

function drawSlots(sel){
  const sets = readSets();
  const names = Object.keys(sets).sort();
  opt('slots').innerHTML = '<option value="">불러오기…</option>' +
    names.map(n => `<option value="${esc(n)}"${n === sel ? ' selected' : ''}>${esc(n)} (${sets[n].off !== undefined ? (sets[n].picked || []).length : 0}개 기준)</option>`).join('');
}

function saveSet(){
  if (!picked.size) { alert('선택된 성취기준이 없습니다.'); return; }
  const prev = opt('slots').value;
  const name = (prompt('저장할 이름', prev || autoTitle()) || '').trim();
  if (!name) return;
  const sets = readSets();
  if (sets[name] && !confirm(`"${name}" 을(를) 덮어쓸까요?`)) return;
  sets[name] = {
    tab, picked: [...picked], off: [...off],
    filter: { from: F.from, to: F.to, kinds: [...F.kinds], subjects: [...F.subjects],
              q: F.q, err: F.err },
    opts: OPT_IDS.map(id => opt(id).checked),
    order: opt('order').value, perPage: opt('perPage').value,
    space: opt('spaceAmt').value, hdText: opt('hdText').value, ftText: opt('ftText').value,
    title: opt('title').value, savedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),
  };
  if (writeSets(sets)) { drawSlots(name); alert(`"${name}" 저장했습니다.`); }
}

function loadSet(name){
  if (!name) return;
  const s = readSets()[name];
  if (!s) return;
  tab = s.tab || 0;
  picked.clear(); (s.picked || []).forEach(c => picked.add(c));
  off.clear(); (s.off || []).forEach(k => off.add(k));
  if (s.filter) {
    F.from = s.filter.from; F.to = s.filter.to;
    F.kinds = new Set(s.filter.kinds); F.subjects = new Set(s.filter.subjects);
    F.q = s.filter.q || ''; F.tok = queryTokens(F.q); F.err = s.filter.err || 0;
  }
  // 예전에 저장한 묶음은 opts 가 4칸뿐이다. forEach 는 저장된 길이만큼만 돌므로
  // 그대로 읽힌다 — 그래서 OPT_IDS 는 **뒤에만 덧붙이고 순서를 절대 바꾸지 않는다.**
  (s.opts || []).forEach((v, i) => { if (OPT_IDS[i]) opt(OPT_IDS[i]).checked = v; });
  if (s.order) opt('order').value = s.order;
  if (s.perPage) opt('perPage').value = s.perPage;
  if (s.space) opt('spaceAmt').value = s.space;
  opt('hdText').value = s.hdText || '';
  opt('ftText').value = s.ftText || '';
  opt('title').value = s.title || '';
  drawFilter(); drawTree(); render();
}

function delSet(){
  const name = opt('slots').value;
  if (!name) { alert('삭제할 항목을 목록에서 고르세요.'); return; }
  if (!confirm(`"${name}" 을(를) 지울까요?`)) return;
  const sets = readSets(); delete sets[name];
  if (writeSets(sets)) drawSlots();
}

/* ── 출처 표기(편집 화면에만, build.py 가 채운 DATA.meta 를 그대로 읽는다) ─── */
(function drawAttribution(){
  const el = document.getElementById('attribution');
  const m = DATA.meta || {};
  if (!el || !m.repo) return;
  const name = m.remote ? `<a href="${esc(m.remote)}" target="_blank" rel="noopener">${esc(m.repo)}</a>` : esc(m.repo);
  const rest = [m.version, m.builtAt].filter(Boolean).map(esc).join(' · ');
  el.innerHTML = rest ? `${name} · ${rest}` : name;
})();

/* 데이터가 없는 기능은 UI 를 통째로 숨긴다. 빈 검색창·빈 필터는 고장으로 보인다.
   (④ 번호 덮어쓰기만은 남겨 둔다 — number_box 가 몇 개 빠졌는지 알리는 것이 계약이라
   컨트롤이 사라지면 그 안내를 붙일 자리가 없어진다.) */
(function initExtras(){
  if (!HAS_TEXT) document.getElementById('searchWrap').style.display = 'none';
  if (!HAS_ERR) document.getElementById('errWrap').style.display = 'none';
  else {
    const o = document.createElement('option');
    o.value = 'err'; o.textContent = '오답률 높은 순';
    document.getElementById('order').appendChild(o);
  }
})();

drawFilter(); drawTree(); render(); drawSlots();
</script>
</body>
</html>
