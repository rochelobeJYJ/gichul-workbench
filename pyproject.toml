# 기출 문항집 작업기 — 패키징
#
# ────────────────────────────────────────────────────────────────────────────
# 왜 이 파일이 생겼나
# ────────────────────────────────────────────────────────────────────────────
# 이 도구를 쓸 사람은 고등학교 교사다. 파이썬을 깔아 본 적이 없을 수 있다.
# 예전 설치 안내는 "python.org 에서 파이썬을 받고, 설치할 때 'Add Python to PATH'
# 체크박스를 켜고, pip install -r requirements.txt 를 치세요" 였다.
# 그 체크박스 하나에서 절반이 떨어져 나간다. uv 는 파이썬 자체를 알아서 받아 오므로
# 그 단계가 통째로 사라진다:
#
#     uv run gw subjects
#
# ────────────────────────────────────────────────────────────────────────────
# 정본은 '클론한 폴더 안에서 uv run' 이다 (site-packages 설치가 아니라)
# ────────────────────────────────────────────────────────────────────────────
# 이유가 셋이다.
#
#   1. 갱신이 `git pull` 로 온다. 새 판형 예외에 대응하는 수정이 계속 올라오고,
#      README 가 사용자에게 `git pull` 을 시킨다. 휠로 설치해 두면 클론을 당겨도
#      실행되는 코드는 옛 사본 그대로다 — 고쳤는데 안 고쳐진 것처럼 보인다.
#
#   2. 저장소가 **읽기 전용이 아니다.** `classify --learn ... --install` 이
#      `subjects/<과목>/keywords.json` 에 학습분을 되쓴다(CONTRACT 7절).
#      그 칸은 사람이 판정한 라벨이 있어야만 다시 만들 수 있어서, 가상환경 안으로
#      들어가면 다음 재설치 때 말없이 사라진다.
#
#   3. 스킬 폴더(`~/.claude/skills/gichul-workbench/`)로 통째로 복사해 넣는 배치도
#      결국 '폴더 안에서 돌린다' 와 같은 모양이다. 두 배치를 하나로 다룰 수 있다.
#
# 그래서 `uv run` 은 이 폴더를 **편집 가능(editable)** 으로 붙인다 — 휠은 진입점만
# 나르고, 실제로 읽고 쓰는 코드·자료는 언제나 이 폴더 것이다.
#
# 휠 설치(`pip install .`)도 깨지지는 않게 해 두었다. 자료를 함께 싣고(force-include),
# `common/paths.py` 가 두 배치를 모두 찾는다. 다만 위 2번 때문에 권하지 않는다.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gichul-workbench"
version = "0.1.0"
description = "수능·모의평가 기출을 문항별로 잘라 단원별 학습지로 만드는 도구"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "NOTICE"]

# ── 파이썬 하한: 3.9 ────────────────────────────────────────────────────────
# 추측이 아니라 실측이다. uv 로 3.8·3.9 를 각각 받아 돌려 봤다.
#   3.8.20 — 테스트 1건이 임포트 단계에서 죽는다.
#            `def 문제지(문항수=20) -> list[str]:` 에서 TypeError:
#            'type' object is not subscriptable. `list[str]` 같은 내장형 제네릭은
#            3.9(PEP 585)부터다. 소스는 컴파일되지만 실행이 안 된다.
#   3.9.25 — compileall 통과, 테스트 54건 전부 통과.
# scripts/bootstrap.py 도 같은 값(3.9)으로 검사한다. 두 곳이 갈리지 않게 유지한다.
requires-python = ">=3.9"

# ── 의존성 정본 ─────────────────────────────────────────────────────────────
# requirements.txt 는 이제 이 목록을 가리키기만 한다. 두 곳에 적으면 언젠가 갈라진다.
dependencies = [
    "PyMuPDF>=1.23.0",      # PDF 렌더·텍스트 추출 — 크롭과 추출의 핵심
    "pdfplumber>=0.10.0",   # 정답표 3중 대조의 세 번째 축
    "Pillow>=10.0.0",       # 이미지 다듬기·대지(contact sheet) 생성
    "numpy>=1.24.0",        # 여백 픽셀 측정
    "requests>=2.28.0",     # 기출 내려받기
    "beautifulsoup4>=4.12.0",  # 목록 페이지 파싱
    "openpyxl>=3.1.0",      # 키워드 사전 엑셀 왕복
]

[project.scripts]
# `uv run gw ...` 의 정체. main() 이 종료코드를 돌려주므로 그대로 프로세스 종료코드가 된다.
# 예전 경로인 `python scripts/gw.py ...` 도 그대로 동작한다 — 같은 함수를 부른다.
gw = "gw:main"

[project.urls]
Homepage = "https://github.com/rochelobeJYJ/gichul-workbench"

# ────────────────────────────────────────────────────────────────────────────
# 휠 배치 — scripts/ 안의 것을 그대로 최상위로 올린다
# ────────────────────────────────────────────────────────────────────────────
# 처음에는 `sources = { "scripts" = "gichul_workbench" }` 로 이름 하나 아래에
# 담으려 했다. site-packages 에 build.py·common/·detect.py 같은 흔한 이름을
# 늘리지 않으려는 것이었는데, **hatchling 이 그 배치에서 editable 설치를 거부한다**:
#   "Dev mode installations are unsupported when any path rewrite in the
#    `sources` option changes a prefix rather than removes it"
# (실측. uv run 이 그 자리에서 죽는다.) 접두사를 '바꾸는' 것은 안 되고 '없애는' 것만 된다.
#
# editable 을 포기할 수는 없다 — 위 머리말 1·2번(갱신은 git pull 로 오고, 저장소가
# 읽기 전용이 아니다)이 editable 이 아니면 성립하지 않는다. 그래서 접두사 제거를 쓴다.
#
# 부수 효과를 알고 받는다: editable 설치는 `<저장소>/scripts` 를 sys.path 에 얹으므로
# 그 가상환경에서 `import build` 같은 이름이 우리 것을 집는다. 대신 얻는 것이 있다 —
# `uv run gw` 의 sys.path 가 `python scripts/gw.py` 의 것과 **글자 그대로 같아진다.**
# 이 저장소의 위험은 늘 '두 경로가 조용히 갈리는 것'이었고, 이 배치는 그 위험을 0 으로 만든다.
# 가상환경은 `<저장소>/.venv` 라 이 도구 말고는 아무도 쓰지 않는다.
[tool.hatch.build.targets.wheel]
only-include = ["scripts"]
sources = ["scripts"]

# 자료도 함께 싣는다. 클론 안에서 돌 때는 쓰이지 않는 자리다(클론 것이 언제나 이긴다).
# 이름 하나로 묶은 이유: site-packages 바닥에 subjects/ 나 curriculum/ 같은
# 일반명 폴더를 만들지 않기 위해서다. 찾는 쪽은 common/paths.py 의 `_locate_repo()`.
[tool.hatch.build.targets.wheel.force-include]
"subjects" = "gichul_workbench_data/subjects"
"curriculum/standards" = "gichul_workbench_data/curriculum/standards"
"builder" = "gichul_workbench_data/builder"

# 소스 배포본에는 저장소를 그대로 담는다. 이 도구는 '폴더째로 받아서 그 안에서
# 쓰는' 물건이라, 소스 배포본이 곧 사용 가능한 한 벌이어야 한다.
[tool.hatch.build.targets.sdist]
include = [
    "/scripts", "/subjects", "/curriculum/standards", "/builder", "/docs", "/tests",
    "/README.md", "/SKILL.md", "/AGENTS.md", "/LICENSE", "/NOTICE",
    "/requirements.txt", "/pyproject.toml",
]
